name: RobOffice image

# Minimal publisher for the RobOffice rebrand: builds the Docker image and
# pushes it to ghcr.io/robprian/roboffice on date tags (YYYY.M.D[.N]).
# The tag must match package.json's version.
on:
  push:
    tags: ["20[0-9][0-9].[0-9]*.[0-9]*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: roboffice-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/robprian/roboffice

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag ($TAG) != package.json version ($PKG)" >&2
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
        id: ver
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify anonymous pull
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.ver.outputs.version }}" > /dev/null
          echo "anonymous pull OK"
